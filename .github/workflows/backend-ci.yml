name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, Prisma, Tests and Startup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alpha_tech_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/alpha_tech_ci
      JWT_SECRET: github-actions-test-secret
      PORT: 3000
      CORS_ALLOW_ALL: "true"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alpha_tech_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d alpha_tech_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release safety contract
        run: node tests/release-safety-foundation.contract.test.js

      - name: Startup critical path contract
        run: node tests/startup-critical-path.contract.test.js

      - name: Auth initial bootstrap performance contract
        run: node tests/auth-initial-bootstrap-performance.contract.test.js

      - name: Sales printable performance contract
        run: node tests/sales-printable-performance.contract.test.js

      - name: Canonical E2E authority cleanup contract
        run: node tests/canonical-e2e-authority-cleanup.contract.test.js

      - name: Observability incident detection contract
        run: node tests/observability-incident-detection.contract.test.js

      - name: Render log observability bridge contract
        run: node tests/render-log-observability-bridge.contract.test.js

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Prepare CI database
        run: npx prisma db push --skip-generate

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . \
            -path './node_modules' -prune -o \
            -path './generated' -prune -o \
            -name '*.js' -print0 | \
          xargs -0 -n1 node --check

      - name: Run Sale Customer Search E2E contracts
        run: |
          node tests/customer-unified-search-slice.contract.test.js
          node tests/customer-create-first-association.contract.test.js
          node tests/sale-completion-customer-branch-guard.contract.test.js
          node tests/sale-customer-first-association.contract.test.js
          node tests/repair-customer-authority-regression.contract.test.js
          node tests/pos-sale-e2e-outcome.contract.test.js

      - name: Run Sales completion receipt authority contracts
        run: |
          node tests/sale-settlement-error-authority.contract.test.js
          node src/modules/sales/e2e/completion/saleCompletionFixture.contract.test.js
          node src/modules/sales/e2e/completion/saleCompletionOutcome.contract.test.js

      - name: Run Tax Closing and Accounting Office contracts
        run: |
          node tests/output-vat-accounting-office-package.contract.test.js
          node tests/accounting-office-closing-exceptions.contract.test.js
          node tests/unified-tax-readiness.contract.test.js
          node tests/tax-closing-handoff.contract.test.js
          node tests/tax-period-finalization-integrity.contract.test.js

      - name: Run Public Storefront customer journey contracts
        run: |
          node tests/public-storefront-product-discovery.contract.test.js
          node tests/anonymous-shopping-session-authority.contract.test.js
          node tests/identity-at-commitment-authority-review.contract.test.js
          node tests/product-reservation-commitment-authority-review.contract.test.js

      - name: Run Partner Store operational readiness contracts
        run: |
          node tests/test-database-authority.contract.test.js
          node tests/partner-store-registration-authority-v2.contract.test.js
          node tests/partner-store-review-governance-v2.contract.test.js
          node tests/partner-store-provisioning-v2.contract.test.js
          node tests/partner-store-activation-v2.contract.test.js
          node tests/partner-store-first-login-onboarding-v2.contract.test.js
          node tests/partner-store-operational-readiness-v2.contract.test.js
          node tests/partner-store-application-http-e2e.contract.test.js

      - name: Run backend tests
        run: npm test

      - name: Start backend without prestart schema mutation hooks
        shell: bash
        run: |
          node src/bootstrap/server.js > backend-startup.log 2>&1 &
          echo $! > backend.pid

      - name: Verify backend startup
        shell: bash
        run: |
          for attempt in {1..30}; do
            if ! kill -0 "$(cat backend.pid)" 2>/dev/null; then
              echo "Backend process exited unexpectedly"
              cat backend-startup.log
              exit 1
            fi

            status_code="$(curl --silent --output /dev/null \
              --write-out '%{http_code}' \
              http://127.0.0.1:3000/api/operational-verification/health/live || true)"

            if [ "$status_code" = "200" ]; then
              curl --fail --silent http://127.0.0.1:3000/api/operational-verification/release
              curl --fail --silent http://127.0.0.1:3000/api/operational-verification/health/ready
              exit 0
            fi

            sleep 1
          done

          echo "Backend did not respond within the startup window"
          cat backend-startup.log
          exit 1

      - name: Show backend log
        if: always()
        run: cat backend-startup.log || true

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
