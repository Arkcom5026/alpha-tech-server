name: Document Presentation V2 Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/document-presentation/**'
      - 'src/modules/customer-money/receive/**'
      - 'src/modules/customer-money/settlement/delivery-credit/**'
      - 'src/modules/sales/return/presentation/**'
      - 'src/modules/sales/return/services/saleReturnService.js'
      - 'src/modules/sales/return/query/detail/getSaleReturnByIdController.js'
      - 'src/modules/finance/store-payment-account/**'
      - 'src/modules/finance/customer-receipt/presentation/**'
      - 'src/modules/finance/customer-receipt/create/createCustomerReceiptController.js'
      - 'src/modules/finance/customer-receipt/query/detail/getCustomerReceiptByIdController.js'
      - 'src/modules/finance/combined-billing/presentation/**'
      - 'src/modules/finance/combined-billing/create/createSettlementConsolidatedDelivery.js'
      - 'src/modules/finance/combined-billing/routes/combinedBillingRoutes.js'
      - 'src/modules/branch/runtime/branchRuntimeService.js'
      - 'src/modules/finance/routes/financeRuntimeRoutes.js'
      - 'src/modules/quotation/quotationIssuedSnapshot.js'
      - 'src/modules/quotation/quotationPresentationSnapshot.js'
      - 'src/modules/quotation/quotationService.js'
      - 'src/modules/sales/completion/controllers/saleCompletionController.js'
      - 'src/modules/sales/documents/presentation/**'
      - 'src/modules/sales/documents/print/projectSaleDeliveryNoteService.js'
      - 'src/modules/procurement/purchase-order/presentation/**'
      - 'src/modules/procurement/purchase-order/routes/purchaseOrderRoutes.js'
      - 'src/modules/tax/documents/presentation/**'
      - 'src/modules/tax/documents/issue/issueOutputTaxDocumentService.js'
      - 'src/modules/tax/documents/creditNote/create/issueOutputTaxCreditNoteService.js'
      - 'src/modules/tax/documents/creditNote/print/projectOutputTaxCreditNotePrintableDocumentService.js'
      - 'src/modules/tax/http/taxIntakeRoutes.js'
      - 'prisma/finance/store-payment-account.prisma'
      - 'prisma/platform/document-presentation-snapshot.prisma'
      - 'prisma/foundation/tenant.prisma'
      - 'prisma/migrations/*store_payment_account*/**'
      - 'prisma/migrations/*document_presentation_snapshot*/**'
      - 'tests/document-presentation-v2-foundation.contract.test.js'
      - 'tests/quotation-document-presentation-wave1.contract.test.js'
      - 'tests/delivery-note-document-presentation-wave2.contract.test.js'
      - 'tests/customer-receipt-document-presentation-wave2.contract.test.js'
      - 'tests/purchase-order-document-presentation-wave3.contract.test.js'
      - 'tests/combined-billing-document-presentation-wave3.contract.test.js'
      - 'tests/statutory-document-presentation-wave4.contract.test.js'
      - 'tests/finance-operational-document-presentation-wave5.contract.test.js'
      - '.github/workflows/document-presentation-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alpha_tech_contract
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/alpha_tech_contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run Document Presentation V2 foundation contract
        run: node tests/document-presentation-v2-foundation.contract.test.js
      - name: Run Quotation Document Presentation Wave 1 contract
        run: node tests/quotation-document-presentation-wave1.contract.test.js
      - name: Run Delivery Note Document Presentation Wave 2 contract
        run: node tests/delivery-note-document-presentation-wave2.contract.test.js
      - name: Run Customer Receipt Document Presentation Wave 2 contract
        run: node tests/customer-receipt-document-presentation-wave2.contract.test.js
      - name: Run Purchase Order Document Presentation Wave 3 contract
        run: node tests/purchase-order-document-presentation-wave3.contract.test.js
      - name: Run Combined Billing Document Presentation Wave 3 contract
        run: node tests/combined-billing-document-presentation-wave3.contract.test.js
      - name: Run Statutory Document Presentation Wave 4 contract
        run: node tests/statutory-document-presentation-wave4.contract.test.js
      - name: Run Finance Operational Document Presentation Wave 5 contract
        run: node tests/finance-operational-document-presentation-wave5.contract.test.js
