name: Render Log Observability

on:
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: Minutes of Render logs to collect
        required: false
        default: "60"
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: render-log-observability
  cancel-in-progress: true

jobs:
  snapshot:
    name: Collect Render server logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-d5vg5v3uibrs73cp1vm0
      RENDER_LOG_LOOKBACK_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_minutes || '75' }}
      RENDER_LOG_OUTPUT_DIR: artifacts/render-logs
      RENDER_LOG_PREVIOUS_SUMMARY: artifacts/previous-render-logs/summary.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Render API credential
        shell: bash
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "Missing repository secret: RENDER_API_KEY"
            echo "Create a Render API key and add it under GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Find previous successful snapshot run
        id: previous_snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'render-log-observability.yml',
              branch: 'main',
              status: 'success',
              per_page: 10,
            });
            const previous = data.workflow_runs.find((run) => run.id !== context.runId);
            core.setOutput('run_id', previous ? String(previous.id) : '');

      - name: Download previous snapshot baseline
        if: steps.previous_snapshot.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_snapshot.outputs.run_id }}
          pattern: render-server-logs-*
          path: artifacts/previous-render-logs
          merge-multiple: true

      - name: Collect and sanitize Render logs
        run: node scripts/observability/collect-render-logs.mjs

      - name: Compare with previous snapshot
        run: node scripts/observability/compare-render-snapshots.mjs

      - name: Publish summary to workflow run
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/render-logs/summary.txt ]; then
            {
              echo '## Render Log Snapshot'
              echo '```text'
              cat artifacts/render-logs/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/render-logs/regression.txt ]; then
            {
              echo '## Regression / Degradation Detection'
              echo '```text'
              cat artifacts/render-logs/regression.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Render log artifact
        if: always() && hashFiles('artifacts/render-logs/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: render-server-logs-${{ github.run_id }}
          path: artifacts/render-logs/
          retention-days: 7
          if-no-files-found: error
