name: Settlement Auto Consolidated Delivery CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alpha_tech_targeted_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/alpha_tech_targeted_ci
      JWT_SECRET: github-actions-test-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alpha_tech_targeted_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d alpha_tech_targeted_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma db push --skip-generate
      - name: Run settlement auto-document targeted contracts
        run: |
          node src/modules/customer-money/settlement/delivery-credit/settlementAutoConsolidatedDelivery.contract.test.js
          node src/modules/customer-money/settlement/delivery-credit/settlementAutoConsolidatedDeliveryHistory.contract.test.js
          node src/modules/customer-money/settlement/delivery-credit/deliveryCreditSettlement.contract.test.js
          node src/modules/customer-money/settlement/delivery-credit/deliveryCreditSettlementConcurrency.contract.test.js
          node src/modules/customer-money/settlement/delivery-credit/deliveryCreditSettlementIdempotency.test.js
